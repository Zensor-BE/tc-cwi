name: Publish to PyPI

on:
  push:
    tags:
      # Publish on version tags, e.g. v0.1.0
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

jobs:
  # Separate from `publish` so that the build never holds the PyPI credential
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Check that the tag matches the project version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"

      - name: Lint
        run: uvx ruff check .

      - name: Build
        run: uv build

      # Runs the test suite against the built distributions instead of src/,
      # so a file missing from the package fails here rather than on PyPI
      - name: Test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl --with pytest pytest
      - name: Test (source distribution)
        run: uv run --isolated --no-project --with dist/*.tar.gz --with pytest pytest

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tc-cwi/
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7

      - name: Publish
        run: uv publish
